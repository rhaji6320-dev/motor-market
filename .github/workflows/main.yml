name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q motor_market_v0_6_free_apk.zip
          test -f motor_market_v0_6_free_apk/pubspec.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android
        working-directory: motor_market_v0_6_free_apk
        run: flutter create . --platforms=android --project-name=motor_market

      - name: Get packages
        working-directory: motor_market_v0_6_free_apk
        run: flutter pub get

      - name: Build APK
        working-directory: motor_market_v0_6_free_apk
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motor-bazar-apk
          path: motor_market_v0_6_free_apk/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
